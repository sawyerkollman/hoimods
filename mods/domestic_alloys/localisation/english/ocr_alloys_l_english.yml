l_english:

 ocr_alloys.1.t:0 "Domestic Alloys Program Established"
 ocr_alloys.1.d:0 "With modern excavation techniques mastered, marginal chromite and wolframite deposits at home can finally be worked at scale. Smelters and extraction plants rise near the capital: §Y+8 chromium§! and §Y+8 tungsten§! now flow from domestic sources, and every ton is a ton we need not buy abroad."
 ocr_alloys.1.a:0 "No more begging Ankara."
 ocr_alloys.2.t:0 "Alloy Extraction Expands"
 ocr_alloys.2.d:0 "Improved excavation methods open deeper and leaner ore bodies to profitable extraction. The domestic alloys program expands: §Y+8 chromium§! and §Y+8 tungsten§! join the national supply."
 ocr_alloys.2.a:0 "The mills run day and night."
 ocr_alloys.3.t:0 "Strategic Alloy Independence"
 ocr_alloys.3.d:0 "With the most advanced extraction technology in the world, even trace deposits yield their metal. The program reaches maturity: §Y+12 chromium§! and §Y+12 tungsten§!. The nation's armorers and jet engine plants will never again wait on a foreign convoy."
 ocr_alloys.3.a:0 "Self-sufficiency at last."

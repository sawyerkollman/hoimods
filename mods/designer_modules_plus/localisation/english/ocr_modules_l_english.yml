l_english:

 # ===== Aircraft modules =====
 ocr_unguided_aa_rockets:0 "Unguided A2A Rocket Battery"
 ocr_unguided_aa_rockets_desc:0 "A salvo of unguided rockets fired into bomber formations. Devastating when it connects, wildly inaccurate, and the drag racks ruin the aircraft's handling."
 ocr_gatling_cannon:0 "Rotary Gatling Cannon"
 ocr_gatling_cannon_desc:0 "A multi-barrel rotary cannon pouring out an enormous weight of fire. Heavy, hungry, and utterly lethal in a firing pass."
 ocr_guided_aa_missiles:0 "Guided A2A Missiles"
 ocr_guided_aa_missiles_desc:0 "Guided air-to-air missiles that kill from beyond gun range. The deadliest air-to-air armament of the era."
 ocr_rocket_booster_pods:0 "Rocket Booster Pods"
 ocr_rocket_booster_pods_desc:0 "Strap-on rocket boosters for a terrifying burst of speed. The pilots are not consulted."

 # ===== Tank modules =====
 ocr_reactive_armor:0 "Reactive Armor Blocks"
 ocr_reactive_armor_desc:0 "Explosive reactive armor that defeats incoming shaped charges. Dramatic protection, slightly temperamental."
 ocr_autoloader:0 "Mechanical Autoloader"
 ocr_autoloader_desc:0 "A mechanical loading carousel delivering a brutal rate of fire from a cramped, maintenance-hungry mechanism."
 ocr_rocket_rack:0 "Hull Rocket Rack"
 ocr_rocket_rack_desc:0 "A rack of artillery rockets welded to the hull. A terrifying barrage; terrible for the suspension and the crew's nerves."
 ocr_boiler_plate_armor:0 "Boiler-Plate Applique"
 ocr_boiler_plate_armor_desc:0 "Boiler plate and sandbags bolted on at the depot. Cheap protection that overloads the drivetrain."

 # ===== Ship modules =====
 ocr_antiship_missiles:0 "Guided Anti-Ship Missiles"
 ocr_antiship_missiles_desc:0 "Guided anti-ship missiles mounted in place of torpedo tubes. Longer reach, far greater accuracy, and a warhead no destroyer shrugs off."
 ocr_naval_sam:0 "Naval SAM Battery"
 ocr_naval_sam_desc:0 "A battery of guided surface-to-air missiles - the end of the age of the massed air attack."
 ocr_overpressured_boilers:0 "Overpressured Boilers"
 ocr_overpressured_boilers_desc:0 "Run the boilers past every safety margin. Outruns anything afloat and drinks fuel like a battleship."

 # ===== Hidden techs =====
 ocr_tech_unguided_aa_rockets:0 "Air-to-Air Rocketry"
 ocr_tech_unguided_aa_rockets_desc:0 "Unguided air-to-air rocket batteries can be fitted to our fighters."
 ocr_tech_rocket_boosters:0 "Booster Rocketry"
 ocr_tech_rocket_boosters_desc:0 "Strap-on rocket boosters can be fitted to our aircraft."
 ocr_tech_gatling_cannon:0 "Rotary Cannon Mechanisms"
 ocr_tech_gatling_cannon_desc:0 "Rotary Gatling cannon can be fitted to our advanced airframes."
 ocr_tech_guided_aa_missiles:0 "Guided Missile Seekers"
 ocr_tech_guided_aa_missiles_desc:0 "Guided air-to-air missiles can be fitted to our advanced airframes."
 ocr_tech_tank_wacky:0 "Field Improvisation Kits"
 ocr_tech_tank_wacky_desc:0 "Rocket racks and boiler-plate applique can be fitted to our tanks."
 ocr_tech_reactive_armor:0 "Explosive Reactive Armor"
 ocr_tech_reactive_armor_desc:0 "Reactive armor blocks can be fitted to our advanced tanks."
 ocr_tech_autoloader:0 "Autoloader Mechanisms"
 ocr_tech_autoloader_desc:0 "Mechanical autoloaders can be fitted to our modern tanks."
 ocr_tech_overpressured_boilers:0 "Overpressure Steam Plants"
 ocr_tech_overpressured_boilers_desc:0 "Overpressured boilers can be fitted to our destroyers."
 ocr_tech_naval_missiles:0 "Naval Guided Missiles"
 ocr_tech_naval_missiles_desc:0 "Guided anti-ship and surface-to-air missiles can be fitted to our warships."

 # ===== Wave 2: wacky & broken =====
 ocr_buzzsaw_nose:0 "All-Guns Buzzsaw Nose"
 ocr_buzzsaw_nose_desc:0 "Every gun in the inventory, mounted in the nose. An airborne buzzsaw that shreds anything in front of it and turns like a freight train."
 ocr_drop_tank_overload:0 "Drop-Tank Overload"
 ocr_drop_tank_overload_desc:0 "Fuel in every void space and two more tanks under the wings. The range is incredible. So is the fireball."
 ocr_armored_bathtub:0 "Armored Bathtub Cockpit"
 ocr_armored_bathtub_desc:0 "An armored bathtub wrapped around the pilot. Confidence goes up; performance goes down."
 ocr_pulsejet_booster:0 "Pulsejet Booster"
 ocr_pulsejet_booster_desc:0 "A pulsejet bolted to the fuselage. The droning terrifies everyone, including the pilot."
 ocr_parasite_cradle:0 "Parasite Fighter Cradle"
 ocr_parasite_cradle_desc:0 "A cradle under the bomber carrying its own escort fighter. Recovery procedures are described as 'aspirational.'"
 ocr_governor_removal:0 "Governor Removal"
 ocr_governor_removal_desc:0 "Remove the factory speed governor. The engine screams, the mechanics weep, the tank flies."
 ocr_concrete_cladding:0 "Concrete Cladding"
 ocr_concrete_cladding_desc:0 "Poured concrete over the glacis. It is, technically, armor."
 ocr_ram_prow:0 "Reinforced Ram Prow"
 ocr_ram_prow_desc:0 "A reinforced ram prow for when the ammunition runs out. The armament of last resort is the vehicle itself."
 ocr_sprint_rockets:0 "Sprint Rocket Boosters"
 ocr_sprint_rockets_desc:0 "Rocket-assisted sprint boosters, enthusiastically endorsed by engineers who will never ride inside."
 ocr_torpedo_broadside:0 "Torpedo Broadside Racks"
 ocr_torpedo_broadside_desc:0 "More torpedo tubes than sense. A staggering broadside that mostly goes somewhere near the enemy."
 ocr_deck_artillery:0 "Deck-Mounted Field Artillery"
 ocr_deck_artillery_desc:0 "Army field guns bolted to the deck. The navy is appalled. It works."
 ocr_depth_charge_carpet:0 "Depth Charge Carpet Launcher"
 ocr_depth_charge_carpet_desc:0 "Saturate the whole grid square and let God sort out the submarines."

 ocr_tech_plane_field_mods:0 "Airframe Field Modifications"
 ocr_tech_plane_field_mods_desc:0 "Field-modification kits can be fitted to our aircraft."
 ocr_tech_buzzsaw:0 "Massed Gun Mountings"
 ocr_tech_buzzsaw_desc:0 "All-guns nose batteries can be fitted to our improved airframes."
 ocr_tech_pulsejet:0 "Pulsejet Applications"
 ocr_tech_pulsejet_desc:0 "Pulsejet boosters can be fitted to our aircraft."
 ocr_tech_parasite:0 "Parasite Aircraft Trials"
 ocr_tech_parasite_desc:0 "Parasite fighter cradles can be fitted to our large airframes."
 ocr_tech_tank_sprint:0 "Rocket Sprint Trials"
 ocr_tech_tank_sprint_desc:0 "Sprint rocket boosters can be fitted to our tanks."

